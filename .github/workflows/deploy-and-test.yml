name: NanoSafe Web E2E Deploy & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: sqlite3
        # In-memory or file-based DB, configured via DATABASE_URL

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start Flask Application
      env:
        FLASK_ENV: testing
        SECRET_KEY: test-key-development-value-only
        DATABASE_URL: sqlite:///nanosafe.db
        WTF_CSRF_ENABLED: "false"
        PORT: 5000
      run: |
        python app.py &
        sleep 5

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install E2E Node dependencies
      run: |
        cd NanoSafe_Analyzer_E2E
        npm install

    - name: Run E2E Test Suite
      env:
        TEST_BASE_URL: http://127.0.0.1:5000
      run: |
        cd NanoSafe_Analyzer_E2E
        npm test

    - name: Compile Excel & HTML Reports
      run: |
        cd NanoSafe_Analyzer_E2E
        node utils/excelReporter.js
        node utils/htmlReportGenerator.js

    - name: Archive Test Reports
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-reports
        path: |
          reports/latest/selenium-report.xlsx
          reports/latest/execution-report.html
