          path: reports/latest/load-test-report.xlsx

  # 7. 🔒 Vulnerability Tests (450)
  vulnerability-tests:
    name: "🔒 Vulnerability Tests (450)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd NanoSafe_Analyzer_E2E
          npm install
      - name: Run 450 DAST Vulnerability Tests
        run: |
          node scripts/run_vulnerability_tests.js
      - name: Upload Vulnerability Test Report
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-test-report
          path: reports/latest/vulnerability-test-report.xlsx

  # 8. 🔄 Full E2E Tests (450)
  full-e2e-tests:
    name: "🔄 Full E2E Tests (450)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd NanoSafe_Analyzer_E2E
          npm install
      - name: Run 450 Full E2E Tests
        run: |
          node scripts/run_full_e2e_tests.js
      - name: Upload Full E2E Report
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: reports/latest/full-e2e-report.xlsx

  # 9. 📊 Compile Master Excel Report & Upload
  compile-master-excel-report:
    name: "📊 Compile Master Excel Report & Upload"
    needs:
      - selenium-web-tests
      - appium-android-tests
      - unit-api-tests
      - validation-tests
      - deployment-status-tests
      - load-performance-tests
      - vulnerability-tests
      - full-e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd NanoSafe_Analyzer_E2E
          npm install
      - name: Download all test reports
        uses: actions/download-artifact@v4
        with:
          path: reports/latest/downloaded
      - name: Flatten Artifacts
        run: |
          mkdir -p reports/latest
          cp -r reports/latest/downloaded/*/* reports/latest/ || true
      - name: Compile Master Excel Workbook & HTML
        run: |
          node scripts/compile_master_excel_report.js
      - name: Upload Master Excel Package
        uses: actions/upload-artifact@v4
        with:
          name: Master_NanoSafe_E2E_Test_Report
          path: |
            reports/latest/Master_NanoSafe_E2E_Test_Report.xlsx
            reports/latest/Master_Execution_Dashboard.html
