name: NanoSafe Load & Performance Benchmarking

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start Flask Application
      env:
        FLASK_ENV: testing
        SECRET_KEY: test-key-development-value-only
        DATABASE_URL: sqlite:///nanosafe.db
        WTF_CSRF_ENABLED: "false"
        PORT: 5000
        ADMIN_USERNAME: admin
        ADMIN_EMAIL: admin@nanosafe.local
        ADMIN_PASSWORD: AdminPassword123!
      run: |
        python app.py &
        sleep 5

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install testing dependencies
      run: |
        cd NanoSafe_Analyzer_E2E
        npm install

    - name: Run Load Testing
      env:
        BACKEND_URL: http://127.0.0.1:5000
      run: |
        node NanoSafe_Analyzer_Backend/scripts/load-test.js

    - name: Parse Load Test Results
      run: |
        node NanoSafe_Analyzer_Backend/scripts/parseK6Summary.js

    - name: Archive Load Test Reports
      uses: actions/upload-artifact@v4
      with:
        name: load-performance-reports
        path: |
          reports/latest/summary.json
          reports/latest/load-test-summary.md
