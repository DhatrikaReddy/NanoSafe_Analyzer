<!DOCTYPE html>
<html>
<head>

<script>
  if (localStorage.getItem('ns_theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
  }
</script>

    <title>Forgot Password - NanoSafe Analyzer</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
    <style>
        .auth-card {
            max-width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: var(--ns-bg-card);
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        .auth-card h2 { color: #0f766e; margin-bottom: 20px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { font-weight: bold; font-size: 14px; color: var(--ns-text-main); }
        .form-group input { margin-top: 5px; width: 100%; box-sizing: border-box; }
        .alert { padding: 10px; margin-bottom: 20px; border-radius: 5px; text-align: left; font-size: 14px; display: none; }
        .alert.error { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
        .alert.success { background: #dcfce3; color: #166534; border: 1px solid #86efac; }
        .links { margin-top: 20px; font-size: 14px; }
        .links a { color: #0f766e; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body style="background: var(--ns-bg-main);">

<div class="auth-card">
    <h2>Reset Password</h2>
    <p style="color: var(--ns-text-muted); margin-bottom: 25px; font-size: 14px;">
        Enter your registered email address to receive a password reset link.
    </p>

    <div id="alert-box" class="alert"></div>

    <form id="forgot-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" name="email" required autofocus placeholder="name@example.com">
        </div>

        <button type="submit" id="submit-btn" class="ns-btn ns-btn-primary" style="width: 100%; margin-top: 10px;">Send Reset Link</button>
    </form>

    <div class="links">
        <p><a href="{{ url_for('auth.login') }}">Back to Login</a></p>
    </div>
</div>

</body>
</html>
