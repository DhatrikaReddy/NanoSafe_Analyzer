<!DOCTYPE html>
<html>
<head>

<script>
  if (localStorage.getItem('ns_theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
  }
</script>

    <title>Admin Panel — NanoSafe Analyzer</title>
    <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>

<div class="ns-sidebar-layout">
    {% include '_sidebar.html' %}

    <main style="padding: 32px 36px; max-width: 1100px; box-sizing: border-box; width: 100%;">
        <h1 style="font-size: 26px; font-weight: 800; color: var(--ns-text-main); margin: 0 0 20px;">Admin Dashboard</h1>

        <div class="card">
            <h2>Welcome, {{ username }}</h2>
            <p>You are logged in as Admin.</p>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <a href="{{ url_for('admin.dashboard') }}"><button type="button" class="ns-btn ns-btn-primary">🛡️ Admin Console</button></a>
                <a href="{{ url_for('main.home') }}"><button type="button" class="ns-btn ns-btn-secondary">🏠 App Home</button></a>
            </div>
        </div>
    </main>
</div>

</body>
</html>
